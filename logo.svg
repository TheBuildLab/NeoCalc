<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with Gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" filter="url(#glow)"/>
  
  <!-- Glass Effect Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#glassGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="2" opacity="0.8"/>
  
  <!-- Calculator Frame -->
  <rect x="50" y="50" width="100" height="100" rx="12" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  
  <!-- Display Screen -->
  <rect x="58" y="58" width="84" height="28" rx="6" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Display Numbers -->
  <text x="95" y="77" font-size="16" font-weight="600" fill="white" text-anchor="middle" font-family="'Inter', sans-serif">42</text>
  
  <!-- Button Grid -->
  <!-- Row 1 -->
  <rect x="58" y="92" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="73" y="92" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="88" y="92" width="12" height="12" rx="2" fill="rgba(255,165,0,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="103" y="92" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  
  <!-- Row 2 -->
  <rect x="58" y="107" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="73" y="107" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="88" y="107" width="12" height="12" rx="2" fill="rgba(255,165,0,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="103" y="107" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  
  <!-- Row 3 -->
  <rect x="58" y="122" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="73" y="122" width="12" height="12" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="88" y="122" width="12" height="12" rx="2" fill="rgba(46,204,113,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <rect x="103" y="122" width="12" height="12" rx="2" fill="rgba(46,204,113,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  
  <!-- Highlight for Glassmorphism Effect -->
  <ellipse cx="75" cy="75" rx="25" ry="25" fill="rgba(255,255,255,0.1)" opacity="0.5"/>
</svg>